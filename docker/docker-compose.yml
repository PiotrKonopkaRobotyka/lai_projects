services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: developer
        USER_UID: 1000
        USER_GID: 1000
    image: lai_ws:jazzy
    container_name: lai_dev
    
    volumes:
      - ..:/home/developer/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    
    working_dir: /home/developer/workspace
    
    stdin_open: true
    tty: true
    
    network_mode: host
    
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    
    devices:
      - /dev/input:/dev/input
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
